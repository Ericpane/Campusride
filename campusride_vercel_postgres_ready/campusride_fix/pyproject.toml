[project]
name = "campusride"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2,<5.3",
    "psycopg[binary]>=3.2,<4",
    "qrcode[pil]>=7.4",
    "Pillow>=10.0",
    "numpy>=1.24",
    "scikit-learn>=1.3,<2.0",
    "joblib>=1.3",
    "pyomo>=6.6",
    "whitenoise>=6.6",
]

[tool.vercel.scripts]
build = "python manage.py migrate --noinput"
