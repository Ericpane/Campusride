<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Set Destination - CampusRide</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: 20px auto; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        select, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        button { background: #1a73e8; color: white; border: none; cursor: pointer; }
        .back { display: block; text-align: center; margin-top: 10px; color: #1a73e8; text-decoration: none; }
        .debug { font-size: 12px; color: #999; margin-top: 10px; }
    </style>
</head>
<body>
<div class="card">
    <h2>📍 Where are you going?</h2>
    {% if error %}<div style="color:red; margin-bottom:10px;">{{ error }}</div>{% endif %}
    <form method="post" id="destinationForm">
        {% csrf_token %}
        <select name="destination" required>
            <option value="">-- Select Destination --</option>
            {% for loc in destinations %}
                <option value="{{ loc.id }}">{{ loc.name }}</option>
            {% endfor %}
        </select>
        <input type="hidden" name="lat" id="lat" value="">
        <input type="hidden" name="lng" id="lng" value="">
        <button type="submit" id="startBtn" disabled>Start Route</button>
    </form>
    <a href="{% url 'driver_map' %}" class="back">← Back</a>
    <div class="debug" id="debugInfo">Waiting for GPS fix...</div>
</div>
<script>
    var latInput = document.getElementById('lat');
    var lngInput = document.getElementById('lng');
    var debugEl = document.getElementById('debugInfo');
    var startBtn = document.getElementById('startBtn');
    var FALLBACK_LAT = 7.4436;
    var FALLBACK_LNG = 3.8970;
    var resolved = false;
    var watchId = null;
    var bestAccuracy = Infinity;

    function applyLocation(lat, lng, accuracy, source, isFallback) {
        lat = Number(lat); lng = Number(lng);
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
        if (isFallback && resolved) return;
        if (!isFallback && resolved && Number.isFinite(accuracy) &&
            Number.isFinite(bestAccuracy) && accuracy > bestAccuracy + 5) return;

        resolved = !isFallback;
        if (!isFallback && Number.isFinite(accuracy)) bestAccuracy = accuracy;
        latInput.value = lat.toFixed(8);
        lngInput.value = lng.toFixed(8);
        var accText = Number.isFinite(accuracy) ? ' (±' + Math.round(accuracy) + 'm)' : '';
        debugEl.innerText = '📍 ' + source + ': ' +
            lat.toFixed(6) + ', ' + lng.toFixed(6) + accText;
        startBtn.disabled = false;
    }

    function useFallback(reason) {
        applyLocation(FALLBACK_LAT, FALLBACK_LNG, null,
            'Test location (' + reason + ')', true);
    }

    function startGps() {
        if (!window.isSecureContext) {
            debugEl.innerText =
                'GPS requires HTTPS or localhost in this browser. Open the app via an HTTPS URL.';
            return;
        }
        if (!navigator.geolocation) {
            debugEl.innerText = 'Geolocation is not supported by this browser.';
            return;
        }

        debugEl.innerText = 'Requesting precise device location…';
        navigator.geolocation.getCurrentPosition(
            function (pos) {
                applyLocation(pos.coords.latitude, pos.coords.longitude,
                    pos.coords.accuracy, 'Device GPS', false);
            },
            function (err) {
                debugEl.innerText =
                    'Precise GPS is taking longer (' + (err.message || 'no fix') +
                    '). Waiting for live location…';
            },
            { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
        );

        watchId = navigator.geolocation.watchPosition(
            function (pos) {
                applyLocation(pos.coords.latitude, pos.coords.longitude,
                    pos.coords.accuracy, 'Live device location', false);
            },
            function (err) {
                debugEl.innerText =
                    'GPS: ' + (err.message || 'location unavailable') +
                    '. Retry or choose the test location.';
            },
            { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
        );
    }

    startGps();
</script>
</body>
</html>
