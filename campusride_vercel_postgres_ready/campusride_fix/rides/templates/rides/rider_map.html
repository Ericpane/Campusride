<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>CampusRide - Rider Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin:0; padding:0; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100%; }
        .info {
            position: absolute; top: 10px; left: 10px; right: 10px;
            background: white; padding: 10px 16px; border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25); z-index: 1000; font-size: 14px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .debug {
            position: absolute; bottom: 70px; left: 10px; right: 10px;
            background: rgba(0,0,0,0.85); color: white; padding: 8px 10px;
            border-radius: 6px; font-size: 11px; z-index: 1000; max-width: 95%;
            line-height: 1.35; word-break: break-word;
        }
        .test-btn {
            position: absolute; bottom: 20px; left: 10px; right: 10px;
            z-index: 1000; padding: 10px 12px; border: none; border-radius: 8px;
            background: #059669; color: white; font-weight: 600; font-size: 13px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3); cursor: pointer;
        }
        .keke-marker {
            background: #059669; color: white; border-radius: 50%;
            width: 36px !important; height: 36px !important;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700;
            border: 2px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            text-align: center; line-height: 32px;
        }
        .user-marker { font-size: 22px; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="info" id="info">
        <span id="infoText">Loading Kekes…</span>
        <a href="/logout/" style="font-size:12px;color:#64748b;">Log out</a>
    </div>
    <div class="debug" id="debugInfo">Waiting for GPS…</div>
    <button type="button" class="test-btn" id="useTestBtn">Use campus test location (skip GPS)</button>
    <script>
        var userLat = null;
        var userLng = null;
        var map = null;
        var markers = {};
        var userMarker = null;
        var hasRealFix = false;
        var gpsWatchId = null;
        var bestAccuracy = Infinity;
        var FALLBACK_LAT = 7.4436;
        var FALLBACK_LNG = 3.8970;

        function jitter(lat, lng, id) {
            var seed = (Number(id) || 0) * 17;
            var dx = ((seed % 7) - 3) * 0.00018;
            var dy = (((seed * 3) % 7) - 3) * 0.00018;
            return [lat + dx, lng + dy];
        }

        function geoErrorText(err) {
            if (!err) return 'unknown';
            if (err.code === 1) return 'PERMISSION_DENIED (allow location in browser)';
            if (err.code === 2) return 'POSITION_UNAVAILABLE (no signal)';
            if (err.code === 3) return 'TIMEOUT';
            return err.message || ('code ' + err.code);
        }

        function initMap(lat, lng) {
            if (map) return;
            map = L.map('map').setView([lat, lng], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
            userMarker = L.marker([lat, lng], {
                icon: L.divIcon({ className: 'user-marker', html: '📍', iconSize: [28, 28], iconAnchor: [14, 14] }),
                zIndexOffset: 1000
            }).addTo(map).bindPopup('You are here');
            startPolling();
        }

        function applyLocation(lat, lng, accuracy, source) {
            userLat = Number(lat);
            userLng = Number(lng);
            var accText = (Number.isFinite(Number(accuracy))) ?
                (' · ±' + Math.round(Number(accuracy)) + 'm') : '';
            document.getElementById('debugInfo').innerText =
                source + ': ' + userLat.toFixed(6) + ', ' + userLng.toFixed(6) + accText;

            if (!map) {
                initMap(userLat, userLng);
            } else {
                map.setView([userLat, userLng], map.getZoom());
                if (userMarker) userMarker.setLatLng([userLat, userLng]);
            }
        }

        function useTestLocation() {
            hasRealFix = false;
            if (gpsWatchId !== null) {
                navigator.geolocation.clearWatch(gpsWatchId);
                gpsWatchId = null;
            }
            applyLocation(FALLBACK_LAT, FALLBACK_LNG, null, 'TEST campus center');
        }

        function acceptGpsPosition(pos) {
            var accuracy = Number(pos.coords.accuracy);
            if (!Number.isFinite(accuracy)) accuracy = null;
            if (hasRealFix && accuracy !== null && Number.isFinite(bestAccuracy) &&
                accuracy > bestAccuracy + 5) return;
            hasRealFix = true;
            if (accuracy !== null) bestAccuracy = accuracy;
            applyLocation(pos.coords.latitude, pos.coords.longitude, accuracy, 'Live device GPS');
        }

        function startGps() {
            if (!window.isSecureContext) {
                document.getElementById('debugInfo').innerText =
                    'GPS requires HTTPS or localhost. Open this app through an HTTPS URL; ' +
                    'the test button is only for development.';
                initMap(FALLBACK_LAT, FALLBACK_LNG);
                return;
            }
            if (!navigator.geolocation) {
                document.getElementById('debugInfo').innerText =
                    'Geolocation is not supported by this browser.';
                initMap(FALLBACK_LAT, FALLBACK_LNG);
                return;
            }

            document.getElementById('debugInfo').innerText =
                'Requesting precise device location…';

            navigator.geolocation.getCurrentPosition(
                acceptGpsPosition,
                function (err) {
                    document.getElementById('debugInfo').innerText =
                        'Precise GPS not ready: ' + geoErrorText(err) +
                        '. Waiting for live fix…';
                },
                { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
            );

            gpsWatchId = navigator.geolocation.watchPosition(
                acceptGpsPosition,
                function (err) {
                    document.getElementById('debugInfo').innerText =
                        'Live GPS: ' + geoErrorText(err) +
                        '. Last good location is retained.';
                },
                { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
            );
        }

        document.getElementById('useTestBtn').addEventListener('click', useTestLocation);
        startGps();

        function startPolling() {
            function fetchTrips() {
                var url = '/api/active-trips/';
                if (userLat !== null && userLng !== null) {
                    url += '?lat=' + userLat + '&lng=' + userLng;
                }
                fetch(url)
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        var trips = data.trips || [];
                        updateMarkers(trips);
                        document.getElementById('infoText').innerText =
                            trips.length + ' Keke' + (trips.length === 1 ? '' : 's') + ' available';
                    })
                    .catch(function (err) {
                        console.error('Poll failed:', err);
                        document.getElementById('infoText').innerText = 'Error loading Kekes';
                    });
            }
            fetchTrips();
            setInterval(fetchTrips, 3000);
        }

        function updateMarkers(trips) {
            if (!map) return;

            var currentIds = trips.map(function (t) { return String(t.id); });

            Object.keys(markers).forEach(function (id) {
                if (currentIds.indexOf(id) === -1) {
                    map.removeLayer(markers[id]);
                    delete markers[id];
                }
            });

            var bounds = [];
            if (userLat != null && userLng != null) {
                bounds.push([userLat, userLng]);
            }

            trips.forEach(function (trip) {
                var lat = Number(trip.lat);
                var lng = Number(trip.lng);
                if (isNaN(lat) || isNaN(lng)) return;

                var pos = [lat, lng];
                bounds.push(pos);

                var id = String(trip.id);
                var seats = trip.seats_available != null ? trip.seats_available : '?';
                var label = '🚗' + seats;

                if (markers[id]) {
                    markers[id].setLatLng(pos);
                    markers[id].setIcon(L.divIcon({
                        className: 'keke-marker',
                        html: label,
                        iconSize: [36, 36],
                        iconAnchor: [18, 18]
                    }));
                } else {
                    var marker = L.marker(pos, {
                        icon: L.divIcon({
                            className: 'keke-marker',
                            html: label,
                            iconSize: [36, 36],
                            iconAnchor: [18, 18]
                        }),
                        title: (trip.destination || 'Keke') + ' — ' + seats + ' seats'
                    });
                    var dest = trip.destination || 'System plan';
                    var fare = trip.fare_estimate != null ? trip.fare_estimate : '—';
                    marker.bindPopup(
                        '<div style="min-width:140px">' +
                        '<strong>' + dest + '</strong><br>' +
                        'Seats: ' + seats + ' / ' + (trip.total_seats || '?') + '<br>' +
                        'Fare est: ₦' + fare + '<br>' +
                        '<a href="/keke/' + trip.id + '/" style="color:#059669;font-weight:600">Request seat →</a>' +
                        '</div>'
                    );
                    marker.addTo(map);
                    markers[id] = marker;
                }
            });

            if (bounds.length > 1) {
                try {
                    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 });
                } catch (e) {}
            }
        }
    </script>
</body>
</html>
